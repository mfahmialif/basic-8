<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <rect width="160" height="160" fill="#FCE7EF"/>
  
  <!-- Continuous seamless diagonal lattice -->
  <g fill="none" stroke="#D89AA7" stroke-width="8" stroke-linecap="square">
    <!-- Diagonals / -->
    <line x1="-80" y1="80" x2="80" y2="240"/>
    <line x1="-40" y1="40" x2="120" y2="200"/>
    <line x1="0" y1="0" x2="160" y2="160"/>
    <line x1="40" y1="-40" x2="200" y2="120"/>
    <line x1="80" y1="-80" x2="240" y2="80"/>

    <!-- Diagonals \ -->
    <line x1="80" y1="-80" x2="-80" y2="80"/>
    <line x1="120" y1="-40" x2="-40" y2="120"/>
    <line x1="160" y1="0" x2="0" y2="160"/>
    <line x1="200" y1="40" x2="40" y2="200"/>
    <line x1="240" y1="80" x2="80" y2="240"/>
  </g>

  <!-- Inner stitched diamond accents -->
  <g fill="none" stroke="#E5ADC0" stroke-width="1.5" stroke-dasharray="3,3">
    <!-- Center diamonds -->
    <polygon points="40,16 64,40 40,64 16,40"/>
    <polygon points="120,16 144,40 120,64 96,40"/>
    <polygon points="40,96 64,120 40,144 16,120"/>
    <polygon points="120,96 144,120 120,144 96,120"/>
    <polygon points="80,56 104,80 80,104 56,80"/>

    <!-- Edge diamonds -->
    <polygon points="80,-24 104,0 80,24 56,0"/>
    <polygon points="80,136 104,160 80,184 56,160"/>
    <polygon points="0,56 24,80 0,104 -24,80"/>
    <polygon points="160,56 184,80 160,104 136,80"/>

    <!-- Corner diamonds -->
    <polygon points="0,-24 24,0 0,24 -24,0"/>
    <polygon points="160,-24 184,0 160,24 136,0"/>
    <polygon points="0,136 24,160 0,184 -24,160"/>
    <polygon points="160,136 184,160 160,184 136,160"/>
  </g>

  <!-- Delicate center dots -->
  <g fill="#B76E73">
    <circle cx="40" cy="40" r="3.5"/>
    <circle cx="120" cy="40" r="3.5"/>
    <circle cx="40" cy="120" r="3.5"/>
    <circle cx="120" cy="120" r="3.5"/>
    <circle cx="80" cy="80" r="3.5"/>

    <!-- Edge dots -->
    <circle cx="80" cy="0" r="3.5"/>
    <circle cx="80" cy="160" r="3.5"/>
    <circle cx="0" cy="80" r="3.5"/>
    <circle cx="160" cy="80" r="3.5"/>

    <!-- Corner dots -->
    <circle cx="0" cy="0" r="3.5"/>
    <circle cx="160" cy="0" r="3.5"/>
    <circle cx="0" cy="160" r="3.5"/>
    <circle cx="160" cy="160" r="3.5"/>
  </g>
</svg>